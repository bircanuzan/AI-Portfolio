name: HumanEvoX Recruitment OS — tests

on:
  push:
    paths:
      - "HumanEvoX-Recruitment-OS/**"
      - ".github/workflows/humanevox-recruitment-os-tests.yml"
  pull_request:
    paths:
      - "HumanEvoX-Recruitment-OS/**"
      - ".github/workflows/humanevox-recruitment-os-tests.yml"
  workflow_dispatch:

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: HumanEvoX-Recruitment-OS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "HumanEvoX-Recruitment-OS/requirements-dev.txt"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate import syntax
        run: python -m compileall -q app.py demo_seed.py humanevox
      - name: Run deterministic tests
        run: python -m pytest -q
