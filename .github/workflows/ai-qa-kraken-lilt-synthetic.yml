name: AI QA and data-ops synthetic portfolio checks
on:
  push:
    paths:
      - '28_AI_Testing_and_Quality_Review/**'
      - '39_Human_Data_Operations_Management/**'
      - '.github/workflows/ai-qa-kraken-lilt-synthetic.yml'
  pull_request:
    paths:
      - '28_AI_Testing_and_Quality_Review/**'
      - '39_Human_Data_Operations_Management/**'
      - '.github/workflows/ai-qa-kraken-lilt-synthetic.yml'
  workflow_dispatch:
jobs:
  kraken-agent-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify synthetic agent gate and regression tests
        working-directory: 28_AI_Testing_and_Quality_Review
        run: |
          python -m unittest qa_demo.test_agent_ops_eval -v
          python qa_demo/agent_ops_eval.py qa_demo/agent_events_synthetic.json
  lilt-annotation-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify synthetic multilingual data quality
        working-directory: 39_Human_Data_Operations_Management
        run: |
          python -m unittest tests.test_lilt_batch_eval -v
          python src/lilt_batch_eval.py
