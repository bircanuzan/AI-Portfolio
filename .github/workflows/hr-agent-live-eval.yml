name: HR Agent — Manual Live LLM Evaluation
on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: 'Synthetic cases to run (1-16; API charges may apply)'
        required: true
        default: '4'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 'Agentic AI Application Testing & Evaluation for HR Transformation'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require private API secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing OPENAI_API_KEY Actions secret"; exit 1
          fi
      - name: Install OpenAI Agents SDK
        run: python -m pip install -r requirements-live.txt
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run live API-backed evaluation
        env:
          SAMPLE_SIZE: ${{ inputs.sample_size }}
        run: |
          if ! [[ "$SAMPLE_SIZE" =~ ^([1-9]|1[0-6])$ ]]; then
            echo "sample_size must be an integer from 1 to 16"; exit 1
          fi
          python evaluate_live.py --limit "$SAMPLE_SIZE"
      - name: Upload synthetic evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-agent-live-evidence
          path: Agentic AI Application Testing & Evaluation for HR Transformation/evidence/live_evaluation_results.json
          retention-days: 7
          if-no-files-found: ignore
