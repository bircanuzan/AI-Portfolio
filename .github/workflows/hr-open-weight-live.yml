name: HR Live LLM — Public Qwen CPU (No API Key)
on:
  workflow_dispatch:
  push:
    paths:
      - 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation/run_local_model.trigger'
permissions:
  contents: write
jobs:
  open-weight-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline regression tests first
        working-directory: 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation'
        run: python -m unittest discover -s tests -v
      - name: Download public Apache 2.0 Qwen quantized model
        working-directory: 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation'
        run: |
          mkdir -p models
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 480 \
            --output models/qwen.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          test "$(stat -c%s models/qwen.gguf)" -gt 1000000000
      - name: Start real language model with llama.cpp CPU server
        working-directory: 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation'
        run: |
          docker run -d --rm --name hr-qwen-demo \
            -p 127.0.0.1:8080:8080 \
            -v "$(pwd)/models:/models:ro" \
            ghcr.io/ggml-org/llama.cpp:server \
            -m /models/qwen.gguf -a hr-qwen --host 0.0.0.0 --port 8080 \
            --ctx-size 2048 --threads 4
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              echo "Actual model server is ready"; exit 0
            fi
            sleep 2
          done
          docker logs hr-qwen-demo || true
          exit 1
      - name: Evaluate real model completions and policy guardrails
        working-directory: 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation'
        env:
          LOCAL_LLM_ENDPOINT: http://127.0.0.1:8080/v1/chat/completions
          LOCAL_LLM_MODEL: hr-qwen
          LOCAL_LLM_SOURCE: Qwen/Qwen2.5-1.5B-Instruct-GGUF (Q4_K_M)
        run: python local_open_weight_llm.py
      - name: Save executed model evidence as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-qwen-real-model-evidence
          path: 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation/evidence/local_llm_results.json'
          retention-days: 14
          if-no-files-found: ignore
      - name: Commit successful synthetic evidence to GitHub
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation/evidence/local_llm_results.json"
          if git diff --cached --quiet; then
            echo "Evidence unchanged"
          else
            git commit -m "Add actual local Qwen HR LLM evaluation evidence [skip ci]"
            git push origin HEAD:main
          fi
      - name: Show model runtime logs for debugging
        if: failure()
        run: docker logs hr-qwen-demo || true
