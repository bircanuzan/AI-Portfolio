name: Machine Learning Engineer - Reliability Lab CI

on:
  push:
    paths:
      - 'Machine Learning Engineer/**'
      - '.github/workflows/machine-learning-engineer-ci.yml'
  pull_request:
    paths:
      - 'Machine Learning Engineer/**'
      - '.github/workflows/machine-learning-engineer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests-and-synthetic-evaluation:
    name: Python ${{ matrix.python-version }} | ML audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: Machine Learning Engineer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Generate machine-readable synthetic ML evaluation report
        run: python -m src.ml_eval_lab --rows 3000 --seed 42 --output-dir artifacts
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ml-reliability-report-python-${{ matrix.python-version }}
          path: Machine Learning Engineer/artifacts/report.json
          if-no-files-found: error
