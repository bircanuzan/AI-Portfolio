name: HR Agent Web App - Tests
on:
  push:
    paths:
      - 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation/service/**'
      - 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation/tests/**'
      - 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation/requirements-service.txt'
      - 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation/agent.py'
      - 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation/policies.json'
      - 'render.yaml'
  pull_request:
    paths:
      - 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation/service/**'
      - 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation/tests/**'
      - 'AI Model Training & Evaluation Freelancer Project/Agentic AI Application Testing & Evaluation for HR Transformation/requirements-service.txt'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 'Agentic AI Application Testing & Evaluation for HR Transformation'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install service dependencies
        run: python -m pip install -r requirements-service.txt
      - name: Compile application
        run: python -m compileall -q agent.py live_llm_agent.py service tests
      - name: Run all offline security and regression tests
        run: python -m unittest discover -s tests -v
