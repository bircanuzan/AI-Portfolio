name: Portfolio identity and client-name audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document inspection dependencies
        run: python -m pip install pypdf openpyxl
      - name: Audit competency taxonomy and Markdown links
        run: python scripts/validate_portfolio_hierarchy.py
      - name: Audit tracked portfolio paths and extractable file contents
        run: python scripts/portfolio_identity_audit.py
