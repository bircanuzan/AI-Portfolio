name: HCIA — Watch the Synthetic Agent Work
on:
  push:
    branches: [main]
    paths:
      - 'Agentic AI development/AI-Human Organizational Design/scripts/render_demo.py'
      - '.github/workflows/hcia-video-demo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare image renderer
        run: python -m pip install 'Pillow>=10,<13' 'imageio-ffmpeg>=0.5,<1'
      - name: Verify ffmpeg available
        run: python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())'
      - name: Render actual synthetic agent outputs into a labelled MP4
        working-directory: Agentic AI development/AI-Human Organizational Design
        run: python scripts/render_demo.py
      - name: Commit synthetic video to the portfolio
        run: |
          src="Agentic AI development/AI-Human Organizational Design/demo/generated/human_capital_intelligence_agent_synthetic_demo.mp4"
          dest="Agentic AI development/AI-Human Organizational Design/demo/Human_Capital_Intelligence_Agent_Synthetic_Demo.mp4"
          cp "$src" "$dest"
          captions_src="Agentic AI development/AI-Human Organizational Design/demo/generated/linkedin_captions.srt"
          captions_dest="Agentic AI development/AI-Human Organizational Design/demo/LinkedIn_Captions.srt"
          cp "$captions_src" "$captions_dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dest" "$captions_dest"
          if ! git diff --cached --quiet; then
            git commit -m "Publish repeatable synthetic Human Capital Intelligence Agent video"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish playable demonstration
        uses: actions/upload-artifact@v4
        with:
          name: hcia-watch-the-agent-work-synthetic-video
          path: Agentic AI development/AI-Human Organizational Design/demo/generated/human_capital_intelligence_agent_synthetic_demo.mp4
          retention-days: 30
