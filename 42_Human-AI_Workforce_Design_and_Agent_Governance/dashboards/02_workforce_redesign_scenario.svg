<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="02   Human–AI Workforce Redesign"><rect width="1200" height="690" fill="#0b0b0e"/><text x="44" y="42" fill="#C6A052" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">HUMANEVOX  /  HUMAN–AI WORKFORCE INTELLIGENCE</text><text x="44" y="96" fill="#F4EFE5" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">02   Human–AI Workforce Redesign</text><text x="44" y="127" fill="#ACA69B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">ILLUSTRATIVE SCENARIO ONLY  ·  ALL VALUES ARE ASSUMPTIONS, NOT BUSINESS RESULTS</text><line x1="44" x2="1156" y1="147" y2="147" stroke="#484137"/><rect x="44" y="178" width="357" height="146" rx="16" fill="#202024"/><text x="64" y="218" fill="#C6A052" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">HUMAN</text><text x="64" y="251" fill="#F4EFE5" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Owns decisions, privacy, legal exceptions</text><text x="64" y="290" fill="#ACA69B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">Accountable owner</text><rect x="423" y="178" width="357" height="146" rx="16" fill="#202024"/><text x="443" y="218" fill="#9AC6DF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">ASSISTIVE ENGINE</text><text x="443" y="251" fill="#F4EFE5" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Provides approved references and drafts</text><text x="443" y="290" fill="#ACA69B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">No autonomous employee action</text><rect x="802" y="178" width="357" height="146" rx="16" fill="#202024"/><text x="822" y="218" fill="#92D2AA" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">HUMAN APPROVER</text><text x="822" y="251" fill="#F4EFE5" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Verifies, authorizes and records outcomes</text><text x="822" y="290" fill="#ACA69B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">Approval not demonstrated in live system</text><rect x="44" y="348" width="710" height="270" rx="16" fill="#202024"/><text x="65" y="383" fill="#F4EFE5" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Illustrative monthly HR case workload</text><text x="65" y="437" fill="#F4EFE5" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Baseline: 200 × 12 minutes</text><text x="622" y="437" fill="#C6A052" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">40.0 h</text><rect x="65" y="451" width="575" height="15" rx="7" fill="#37332d"/><rect x="65" y="451" width="575" height="15" rx="7" fill="#C6A052"/><text x="65" y="507" fill="#F4EFE5" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Assisted: 200 × (5 + 4 + 2) minutes</text><text x="622" y="507" fill="#C6A052" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">36.7 h</text><rect x="65" y="521" width="575" height="15" rx="7" fill="#37332d"/><rect x="65" y="521" width="527.13125" height="15" rx="7" fill="#9AC6DF"/><rect x="772" y="348" width="384" height="270" rx="16" fill="#202024"/><text x="794" y="387" fill="#ACA69B" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">SCENARIO RESULT</text><text x="794" y="452" fill="#C6A052" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="850">+3.3 h</text><text x="794" y="482" fill="#F4EFE5" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">illustrative difference / month</text><text x="794" y="542" fill="#F09A95" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Unvalidated assumptions</text><text x="794" y="577" fill="#ACA69B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400">No measured savings or ROI</text><text x="44" y="663" fill="#ACA69B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">PROJECT 42 • ORIGINAL PORTFOLIO LAB • NOT CLIENT DATA OR PRODUCTION DEPLOYMENT</text></svg>